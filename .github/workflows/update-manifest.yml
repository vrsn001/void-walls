name: Update Manifest & Pre-Generate Thumbnails

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '*.md'
      - 'frontend/**'

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp Image Engine
        run: npm install --no-save sharp

      - name: Generate Manifest & WebP Thumbnails
        run: |
          node scripts/generate-manifest.mjs
          node scripts/generate-thumbnails.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/manifest.json thumbnails/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update wallpapers manifest.json and pre-generated thumbnails" && git push)

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="tab-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep AMOLED Void Black -->
  <rect width="64" height="64" fill="#000000" />
  
  <!-- Outer Razor Sharp Cyan Border -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#00f0ff" stroke-width="2.5" />
  
  <!-- Inner Hazard Framing -->
  <rect x="6" y="6" width="52" height="52" fill="#040609" stroke="#ff5722" stroke-width="1" stroke-opacity="0.75" />
  
  <!-- Corner Hazard Accents -->
  <polygon points="2,2 14,2 2,14" fill="#ff5722" />
  <polygon points="62,62 50,62 62,50" fill="#00f0ff" />
  
  <!-- Crosshair calibration ticks -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#00f0ff" stroke-width="1.5" />
  <line x1="32" y1="54" x2="32" y2="58" stroke="#ff5722" stroke-width="1.5" />
  <line x1="6" y1="32" x2="10" y2="32" stroke="#ff5722" stroke-width="1.5" />
  <line x1="54" y1="32" x2="58" y2="32" stroke="#00f0ff" stroke-width="1.5" />

  <!-- Bold Japanese Kanji 虚 (VOID) -->
  <text x="32" y="44" fill="#ffffff" font-size="36" font-weight="900" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'MS Gothic', sans-serif" text-anchor="middle" filter="url(#tab-glow)">虚</text>
  
  <!-- Sub-label VOID -->
  <rect x="18" y="52" width="28" height="7" fill="#000000" stroke="#00f0ff" stroke-width="0.8" />
  <text x="32" y="57.5" fill="#00f0ff" font-size="5.5" font-weight="900" font-family="'Courier New', monospace" text-anchor="middle" letter-spacing="1">VOID</text>
</svg>
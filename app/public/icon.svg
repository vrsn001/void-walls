<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="terminal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00f0ff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- AMOLED Black Terminal Background -->
  <rect width="64" height="64" rx="6" fill="#000000" />
  
  <!-- Subtle Brutalist Cyan Outer Border -->
  <rect x="2" y="2" width="60" height="60" rx="5" fill="none" stroke="#00f0ff" stroke-width="2.5" />
  
  <!-- Corner Hazard Orange Tick Top Left -->
  <polygon points="2,2 12,2 2,12" fill="#ff5722" />

  <!-- Terminal Command Prompt: >_ -->
  <g filter="url(#terminal-glow)">
    <!-- Chevron Prompt (>) -->
    <path d="M 15 20 L 29 32 L 15 44" fill="none" stroke="#00f0ff" stroke-width="5.5" stroke-linecap="square" stroke-linejoin="miter" />
    
    <!-- Cursor Block (_) -->
    <line x1="35" y1="41" x2="51" y2="41" stroke="#00f0ff" stroke-width="5.5" stroke-linecap="square" />
  </g>
</svg>
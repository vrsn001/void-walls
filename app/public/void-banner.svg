<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="380" style="background:#000000; font-family:'JetBrains Mono','Courier New',monospace,sans-serif;">
  <defs>
    <!-- Blueprint / Cyberpunk Grid -->
    <pattern id="cyber-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#101726" stroke-width="1"/>
      <circle cx="28" cy="28" r="0.8" fill="#1e293b"/>
    </pattern>

    <!-- Hazard Diagonal Stripes -->
    <pattern id="hazard-stripe" width="18" height="18" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#ff5722" stroke-width="5" />
      <line x1="9" y1="0" x2="9" y2="18" stroke="#000000" stroke-width="5" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Pure AMOLED Void Background -->
  <rect width="1100" height="380" fill="#000000" />
  <rect width="1100" height="380" fill="url(#cyber-grid)" opacity="0.95" />

  <!-- Outer Heavy Industrial Brutalist Frame -->
  <rect x="12" y="12" width="1076" height="356" fill="none" stroke="#1a2333" stroke-width="2.5" />
  <rect x="18" y="18" width="1064" height="344" fill="none" stroke="#ff5722" stroke-width="1" stroke-opacity="0.35" />

  <!-- Corner Hazard Brackets -->
  <path d="M 12 44 L 12 12 L 44 12" fill="none" stroke="#ff5722" stroke-width="4.5" />
  <path d="M 1088 44 L 1088 12 L 1056 12" fill="none" stroke="#00f0ff" stroke-width="4.5" />
  <path d="M 12 336 L 12 368 L 44 368" fill="none" stroke="#00f0ff" stroke-width="4.5" />
  <path d="M 1088 336 L 1088 368 L 1056 368" fill="none" stroke="#ff5722" stroke-width="4.5" />

  <!-- Top System Status Header -->
  <rect x="12" y="12" width="1076" height="34" fill="#070a12" stroke="#1a2333" stroke-width="1.5" />
  
  <!-- Blinking Live Status -->
  <circle cx="34" cy="29" r="4.5" fill="#00f0ff" filter="url(#cyan-glow)" />
  <text x="48" y="33" fill="#00f0ff" font-size="11" font-weight="bold" letter-spacing="1.8">SCORCHED EARTH PROTOCOL // SYSTEM: ARMED &amp; ONLINE</text>
  <text x="560" y="33" fill="#64748b" font-size="10" letter-spacing="1.2">LATENCY: 0.08ms · EDGE: VERCEL/FASTLY · REPO: vrsn001/void-walls</text>

  <!-- Top Right Hazard Block -->
  <rect x="926" y="14" width="160" height="30" fill="url(#hazard-stripe)" />
  <rect x="930" y="17" width="152" height="24" fill="#000000" opacity="0.85" />
  <text x="1006" y="33" fill="#ff5722" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1.5">BILLY BUTCHER ED.</text>

  <!-- Left Brutalist Japanese Kanji Stamp -->
  <g transform="translate(42, 70)">
    <!-- Main Box -->
    <rect x="0" y="0" width="144" height="150" fill="#04060a" stroke="#ff5722" stroke-width="3" />
    <rect x="6" y="6" width="132" height="138" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    
    <!-- Calibration crosshairs -->
    <line x1="72" y1="10" x2="72" y2="140" stroke="#161f30" stroke-width="1" />
    <line x1="10" y1="75" x2="134" y2="75" stroke="#161f30" stroke-width="1" />

    <!-- Corner notch marks -->
    <polygon points="0,0 16,0 0,16" fill="#ff5722" />
    <polygon points="144,150 128,150 144,134" fill="#00f0ff" />
    <polygon points="144,0 134,0 144,10" fill="#1e293b" />
    <polygon points="0,150 10,150 0,140" fill="#1e293b" />
    
    <!-- Central Kanji 虚 (VOID) -->
    <text x="72" y="98" fill="#ffffff" font-size="82" font-weight="900" text-anchor="middle" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'MS Gothic', sans-serif">虚</text>
    
    <!-- Kanji Label & Coordinate -->
    <rect x="18" y="124" width="108" height="18" fill="#000000" stroke="#00f0ff" stroke-width="1" />
    <text x="72" y="136" fill="#00f0ff" font-size="9.5" font-weight="bold" text-anchor="middle" letter-spacing="2">VOID // 00</text>
  </g>

  <!-- Main Center Header Typography -->
  <g transform="translate(216, 72)">
    <!-- Title Line -->
    <text x="0" y="44" fill="#ffffff" font-size="46" font-weight="900" letter-spacing="-1" font-family="'Impact', 'Arial Black', sans-serif">VOID<tspan fill="#00f0ff">//</tspan>WALLS</text>
    
    <!-- Japanese Kanji Subtitle Badge -->
    <rect x="330" y="14" width="124" height="34" fill="#070a12" stroke="#ff5722" stroke-width="1.5" />
    <text x="392" y="37" fill="#ff5722" font-size="20" font-weight="900" text-anchor="middle" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif">[ 虚無 ]</text>

    <!-- Subtitle -->
    <text x="2" y="74" fill="#94a3b8" font-size="12" font-weight="bold" letter-spacing="2.8">CURATED UNDERGROUND WALLPAPER ARCHIVE // 3,245+ ASSETS</text>
    
    <!-- Billy Butcher Callout Terminal Box -->
    <rect x="0" y="88" width="842" height="42" fill="#070a12" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="88" width="4" height="42" fill="#00f0ff" />
    <text x="16" y="106" fill="#00f0ff" font-size="11.5" font-weight="bold" font-family="'JetBrains Mono', monospace">&gt; BILLY BUTCHER VERDICT:</text>
    <text x="16" y="122" fill="#e2e8f0" font-size="10.5" font-weight="500">"Oi wankers. Tired of bloated wallpaper apps with tracking cookies and melted AI slop? Scorched earth. Pure 4K, 60fps loops, AMOLED blacks."</text>
    
    <!-- Spec Tags Line -->
    <rect x="0" y="138" width="842" height="26" fill="#040609" stroke="#161f30" stroke-width="1" />
    <text x="14" y="155" fill="#ff5722" font-size="10" font-weight="bold" letter-spacing="1.2">SPEC: <tspan fill="#ffffff">3,245 UHD ASSETS</tspan> · <tspan fill="#00f0ff">ZERO AI-SLOP</tspan> · <tspan fill="#ffffff">60FPS VIDEO LOOPS</tspan> · <tspan fill="#00f0ff">9:16 MOBILE AMOLED</tspan> · <tspan fill="#ffffff">67 VAULT CATEGORIES</tspan></text>
  </g>

  <!-- Bottom Metric HUD Cards Grid -->
  <g transform="translate(42, 246)">
    <!-- Metric 1: Total Assets -->
    <rect x="0" y="0" width="186" height="50" fill="#070a12" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="4" height="50" fill="#ff5722" />
    <text x="16" y="19" fill="#64748b" font-size="9" font-weight="bold" letter-spacing="1.5">TOTAL ARCHIVE</text>
    <text x="16" y="39" fill="#ffffff" font-size="16" font-weight="900" letter-spacing="-0.5">3,245+ ASSETS</text>

    <!-- Metric 2: Live Frontend -->
    <rect x="198" y="0" width="198" height="50" fill="#070a12" stroke="#1e293b" stroke-width="1.5" />
    <rect x="198" y="0" width="4" height="50" fill="#00f0ff" />
    <text x="214" y="19" fill="#64748b" font-size="9" font-weight="bold" letter-spacing="1.5">FRONTEND ENGINE</text>
    <text x="214" y="39" fill="#00f0ff" font-size="14" font-weight="900">VERCEL EDGE APP</text>

    <!-- Metric 3: Live Loops -->
    <rect x="408" y="0" width="186" height="50" fill="#070a12" stroke="#1e293b" stroke-width="1.5" />
    <rect x="408" y="0" width="4" height="50" fill="#ff5722" />
    <text x="424" y="19" fill="#64748b" font-size="9" font-weight="bold" letter-spacing="1.5">MOTION LOOPS</text>
    <text x="424" y="39" fill="#ffffff" font-size="15" font-weight="900">60FPS MP4 / WEBM</text>

    <!-- Metric 4: Mobile Vertical -->
    <rect x="606" y="0" width="186" height="50" fill="#070a12" stroke="#1e293b" stroke-width="1.5" />
    <rect x="606" y="0" width="4" height="50" fill="#00f0ff" />
    <text x="622" y="19" fill="#64748b" font-size="9" font-weight="bold" letter-spacing="1.5">MOBILE 9:16</text>
    <text x="622" y="39" fill="#ffffff" font-size="15" font-weight="900">AMOLED VERTICAL</text>

    <!-- Metric 5: Live CTA Link -->
    <rect x="804" y="0" width="254" height="50" fill="#ff5722" stroke="#ff5722" stroke-width="2" />
    <text x="931" y="24" fill="#000000" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1.5">LIVE PRODUCTION NODE</text>
    <text x="931" y="41" fill="#000000" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">VOIDWALLS.VERCEL.APP ↗</text>
  </g>

  <!-- Bottom Technical Ticker -->
  <rect x="12" y="318" width="1076" height="34" fill="#040609" stroke="#1a2333" stroke-width="1.5" />
  <text x="28" y="339" fill="#64748b" font-size="9.5" font-weight="bold" letter-spacing="1.2">RESOLVER: 3840×2160 (4K), 2560×1440 (2K), 1920×1080 (FHD), 1080×1920 (9:16) · PIPELINE: CLOUDFLARE EDGE + FASTLY</text>
  <text x="1070" y="339" fill="#ff5722" font-size="10" font-weight="900" text-anchor="end" letter-spacing="1.5">// SCORCHED_EARTH_VERIFIED</text>
</svg>
  <text x="28" y="325" fill="#8b9bb4" font-size="10" font-weight="bold" letter-spacing="1.2">CDN: JSDELIVR / GITHUB · RESOLUTIONS: 3840×2160 (4K), 2560×1440 (2K), 1920×1080 (FHD), 1080×1920 (PHONE)</text>
